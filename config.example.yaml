# pktDashboard configuration
# Copy this file to config.yaml and fill in values before starting the service.

# pktFlow connection — internal URL (same host, no need to go through external port if running locally)
pktflow_url: "http://127.0.0.1:8766"

# Service account credentials — must match a viewer-role user in pktFlow's SQLite database
pktflow_username: "pktdashboard"
pktflow_password: "CHANGE_ME"

# Server bind settings
host: "0.0.0.0"
port: 8760

# SSL — optional
# Set ssl_enabled to true and provide absolute paths to your cert and key files.
# The service restarts with HTTPS on the same port — no nginx required.
# Place cert/key in /mnt/software/pktdashboard/tls/ on the server (excluded from git).
ssl_enabled: false
ssl_cert: ""   # e.g. /mnt/software/pktdashboard/tls/cert.pem
ssl_key:  ""   # e.g. /mnt/software/pktdashboard/tls/key.pem
