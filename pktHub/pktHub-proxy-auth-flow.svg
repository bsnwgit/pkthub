<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#60a5fa"/></marker>
    <marker id="arr-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4ade80"/></marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f87171"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#0f1e35" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="900" height="480" fill="#080d18"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">Proxy Authentication Flow</text>
  <text x="450" y="57" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#475569">Runtime request handling with suite token validation</text>
  <line x1="30" y1="70" x2="870" y2="70" stroke="#1e3a5f" stroke-width="1"/>
  <!-- ── Swimlane column headers ── -->
  <!-- Browser -->
  <rect x="20" y="80" width="165" height="38" rx="6" fill="#0d1525" stroke="#334155" stroke-width="1"/>
  <text x="102" y="96" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">CLIENT</text>
  <text x="102" y="112" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Browser / User</text>
  <!-- pktHub -->
  <rect x="210" y="80" width="195" height="38" rx="6" fill="#0d1525" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="307" y="96" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#94a3b8">PROXY</text>
  <text x="307" y="112" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">pktHub</text>
  <!-- pktApp -->
  <rect x="430" y="80" width="195" height="38" rx="6" fill="#0d1525" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="527" y="96" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#94a3b8">BACKEND</text>
  <text x="527" y="112" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#a78bfa">pktApp</text>
  <!-- Auth validator -->
  <rect x="650" y="80" width="230" height="38" rx="6" fill="#0d1525" stroke="#4ade80" stroke-width="1.5"/>
  <text x="765" y="96" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#94a3b8">AUTH ENGINE</text>
  <text x="765" y="112" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#4ade80">Token Validator</text>
  <!-- Swimlane dividers -->
  <line x1="190" y1="76" x2="190" y2="460" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="410" y1="76" x2="410" y2="460" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="630" y1="76" x2="630" y2="460" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <!-- ── STEP 1: Browser sends request ── -->
  <rect x="26" y="144" width="152" height="52" rx="6" fill="#0d1525" stroke="#334155" stroke-width="1.2"/>
  <text x="102" y="164" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="500" fill="#94a3b8">User navigates to</text>
  <text x="102" y="181" text-anchor="middle" font-family="Courier New,monospace" font-size="10" fill="#60a5fa">/proxy/{id}/page</text>
  <line x1="180" y1="170" x2="208" y2="170" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="194" y="163" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="8" fill="#475569">GET</text>
  <!-- ── STEP 2: pktHub proxy ── -->
  <rect x="216" y="136" width="182" height="74" rx="6" fill="#0d1525" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="307" y="156" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Proxies with headers</text>
  <rect x="224" y="163" width="166" height="40" rx="4" fill="#080d18" stroke="#1e3a5f" stroke-width="1"/>
  <text x="307" y="177" text-anchor="middle" font-family="Courier New,monospace" font-size="8.5" fill="#60a5fa">X-Suite-Token: sk-abc...</text>
  <text x="307" y="190" text-anchor="middle" font-family="Courier New,monospace" font-size="8.5" fill="#94a3b8">X-Suite-User: admin</text>
  <text x="307" y="200" text-anchor="middle" font-family="Courier New,monospace" font-size="8.5" fill="#94a3b8">X-Suite-Role: admin</text>
  <line x1="400" y1="173" x2="428" y2="173" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <!-- ── STEP 3: pktApp receives ── -->
  <rect x="436" y="144" width="182" height="52" rx="6" fill="#0d1525" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="527" y="164" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#a78bfa">Receives request</text>
  <text x="527" y="182" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#94a3b8">Extracts X-Suite-Token</text>
  <line x1="620" y1="170" x2="648" y2="170" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- ── AUTH DECISION diamond ── -->
  <polygon points="765,148 840,190 765,232 690,190" fill="#0d1525" stroke="#4ade80" stroke-width="1.5"/>
  <text x="765" y="186" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" font-weight="600" fill="#4ade80">Token</text>
  <text x="765" y="200" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" font-weight="600" fill="#4ade80">match?</text>
  <!-- YES path (down) -->
  <line x1="765" y1="234" x2="765" y2="278" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="778" y="260" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#4ade80">YES</text>
  <!-- YES result box -->
  <rect x="670" y="280" width="190" height="58" rx="6" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
  <text x="765" y="302" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#4ade80">200 OK — Auto-auth</text>
  <text x="765" y="320" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#94a3b8">Page content returned</text>
  <text x="765" y="334" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">Session set automatically</text>
  <!-- NO path (right) -->
  <line x1="841" y1="190" x2="878" y2="190" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="858" y="183" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#f87171">NO</text>
  <!-- NO result box -->
  <rect x="848" y="200" width="46" height="36" rx="6" fill="#2d0a0a" stroke="#f87171" stroke-width="1.5"/>
  <text x="871" y="216" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f87171">401</text>
  <text x="871" y="230" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#f87171">Denied</text>
  <!-- ── STEP 5: Response flows back left ── -->
  <!-- YES result -> pktApp -> pktHub -> Browser return path -->
  <line x1="668" y1="309" x2="622" y2="309" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <rect x="436" y="290" width="182" height="40" rx="6" fill="#0d1525" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="527" y="308" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" font-weight="500" fill="#a78bfa">Sends 200 response</text>
  <text x="527" y="323" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#94a3b8">+ page HTML/JSON</text>
  <line x1="434" y1="310" x2="403" y2="310" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <rect x="216" y="290" width="182" height="40" rx="6" fill="#0d1525" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="307" y="308" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" font-weight="500" fill="#e2e8f0">Forwards response</text>
  <text x="307" y="323" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#94a3b8">Strips internal headers</text>
  <line x1="213" y1="310" x2="182" y2="310" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <rect x="26" y="290" width="152" height="40" rx="6" fill="#052e16" stroke="#4ade80" stroke-width="1.2"/>
  <text x="102" y="308" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#4ade80">Page loaded</text>
  <text x="102" y="324" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#94a3b8">Auto-authenticated</text>
  <!-- Step number labels on left -->
  <text x="22" y="143" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">Step 1</text>
  <text x="212" y="135" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">Step 2</text>
  <text x="432" y="143" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">Step 3</text>
  <text x="648" y="143" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">Step 4</text>
  <text x="22" y="289" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">Step 5</text>
  <!-- Bottom note -->
  <rect x="20" y="400" width="860" height="36" rx="6" fill="#0d1525" stroke="#1e3a5f" stroke-width="1"/>
  <text x="450" y="414" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" font-weight="500" fill="#60a5fa">Token mismatch path:</text>
  <text x="450" y="428" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#94a3b8">If X-Suite-Token does not match the registered token, pktApp returns 401 and pktHub forwards the error to the browser. No session is created.</text>
</svg>