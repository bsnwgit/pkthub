<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#60a5fa"/></marker>
    <marker id="arr-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4ade80"/></marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f87171"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#0f1e35" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="900" height="520" fill="#080d18"/>
  <rect width="900" height="520" fill="url(#grid)"/>
  <text x="450" y="42" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">Suite Token Architecture</text>
  <text x="450" y="62" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" fill="#475569">How pktApp and pktHub establish trusted communication</text>
  <line x1="60" y1="76" x2="840" y2="76" stroke="#1e3a5f" stroke-width="1"/>
  <!-- STEP 1: pktApp generates token -->
  <circle cx="110" cy="118" r="13" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="110" y="124" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">1</text>
  <rect x="60" y="135" width="200" height="110" rx="8" fill="#0d1525" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="60" y="135" width="200" height="4" rx="2" fill="#a78bfa"/>
  <text x="160" y="168" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="600" fill="#a78bfa">pktApp</text>
  <text x="160" y="188" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#94a3b8">Generates and stores</text>
  <text x="160" y="204" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#94a3b8">suite token in SQLite</text>
  <rect x="88" y="218" width="145" height="20" rx="4" fill="#1a1040" stroke="#a78bfa" stroke-width="1" opacity="0.8"/>
  <text x="160" y="232" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="#a78bfa">sk-abc123...xyz789</text>
  <!-- STEP 2: Admin copies -->
  <circle cx="350" cy="118" r="13" fill="#60a5fa" opacity="0.15" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="350" y="124" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">2</text>
  <line x1="262" y1="190" x2="388" y2="190" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-blue)" stroke-dasharray="6,3"/>
  <rect x="272" y="163" width="110" height="44" rx="5" fill="#080d18" stroke="#1e3a5f" stroke-width="1" opacity="0.9"/>
  <text x="327" y="178" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#60a5fa">Admin copies token</text>
  <text x="327" y="192" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">Settings &#8250; Integrations</text>
  <text x="327" y="204" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">&#8250; Copy Token</text>
  <!-- STEP 3: pktHub stores -->
  <circle cx="590" cy="118" r="13" fill="#e2e8f0" opacity="0.15" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="590" y="124" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">3</text>
  <rect x="490" y="135" width="200" height="110" rx="8" fill="#0d1525" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="490" y="135" width="200" height="4" rx="2" fill="#e2e8f0"/>
  <text x="590" y="168" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">pktHub</text>
  <text x="590" y="188" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#94a3b8">Stores token in</text>
  <text x="590" y="204" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#94a3b8">App Registry</text>
  <rect x="518" y="218" width="145" height="20" rx="4" fill="#0a1628" stroke="#475569" stroke-width="1"/>
  <text x="590" y="232" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="#94a3b8">registry[pktPCAP].token</text>
  <!-- STEP 4: pktHub sends header on each proxy request -->
  <circle cx="760" cy="118" r="13" fill="#60a5fa" opacity="0.15" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="760" y="124" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">4</text>
  <line x1="590" y1="247" x2="590" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)" stroke-dasharray="6,3"/>
  <text x="624" y="268" text-anchor="start" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#475569">On every proxied request:</text>
  <rect x="624" y="276" width="160" height="18" rx="4" fill="#0a1628" stroke="#334155" stroke-width="1"/>
  <text x="704" y="289" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="#60a5fa">X-Suite-Token: sk-abc...</text>
  <rect x="624" y="298" width="160" height="18" rx="4" fill="#0a1628" stroke="#334155" stroke-width="1"/>
  <text x="704" y="311" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="#94a3b8">X-Suite-User . X-Suite-Role</text>
  <!-- Proxy request box -->
  <rect x="385" y="328" width="415" height="72" rx="8" fill="#0d1525" stroke="#334155" stroke-width="1.5"/>
  <text x="592" y="350" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="600" fill="#94a3b8">pktHub Proxy Request</text>
  <rect x="400" y="357" width="385" height="34" rx="4" fill="#080d18" stroke="#1e3a5f" stroke-width="1"/>
  <text x="592" y="370" text-anchor="middle" font-family="Courier New,monospace" font-size="9" fill="#60a5fa">GET /app-route  +  X-Suite-Token  +  X-Suite-User  +  X-Suite-Role</text>
  <text x="592" y="384" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" fill="#475569">pktHub injects headers before forwarding to pktApp</text>
  <!-- Arrow: proxy request -> pktApp validate -->
  <line x1="383" y1="360" x2="263" y2="394" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <!-- STEP 5: pktApp validates -->
  <circle cx="110" cy="332" r="13" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="110" y="338" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">5</text>
  <rect x="60" y="350" width="200" height="108" rx="8" fill="#0d1525" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="60" y="350" width="200" height="4" rx="2" fill="#a78bfa"/>
  <text x="160" y="378" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="600" fill="#a78bfa">pktApp validates token</text>
  <text x="160" y="396" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#94a3b8">Compares X-Suite-Token</text>
  <text x="160" y="409" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#94a3b8">against stored SQLite value</text>
  <rect x="70" y="421" width="80" height="24" rx="4" fill="#052e16" stroke="#4ade80" stroke-width="1"/>
  <text x="110" y="437" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#4ade80">Match: auto-auth</text>
  <rect x="158" y="421" width="92" height="24" rx="4" fill="#2d0a0a" stroke="#f87171" stroke-width="1"/>
  <text x="204" y="437" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#f87171">Mismatch: 401</text>
  <!-- Ghost connector showing pktApp same component top and bottom -->
  <line x1="160" y1="247" x2="160" y2="348" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <!-- Legend -->
  <rect x="728" y="358" width="152" height="124" rx="8" fill="#0d1525" stroke="#1e3a5f" stroke-width="1"/>
  <text x="804" y="379" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Legend</text>
  <line x1="743" y1="395" x2="773" y2="395" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="780" y="399" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#94a3b8">Manual copy</text>
  <line x1="743" y1="415" x2="773" y2="415" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="780" y="419" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#94a3b8">Auto request</text>
  <line x1="743" y1="435" x2="773" y2="435" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="780" y="439" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#94a3b8">Proxy + validate</text>
  <circle cx="749" cy="457" r="4" fill="#4ade80" opacity="0.9"/>
  <text x="760" y="461" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#4ade80">Success</text>
  <circle cx="749" cy="474" r="4" fill="#f87171" opacity="0.9"/>
  <text x="760" y="478" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#f87171">Rejected</text>
</svg>